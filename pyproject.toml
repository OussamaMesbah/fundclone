[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorlens"
version = "0.3.0"
description = "Clone any fund or portfolio with a handful of low-cost ETFs, out of sample"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Oussama Mesbah" }]
keywords = [
    "etf",
    "mutual-funds",
    "portfolio-replication",
    "tracking-error",
    "fama-french",
    "factor-models",
    "returns-based-style-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "yfinance>=0.2.58",
]

[project.optional-dependencies]
app = ["pdfplumber>=0.11", "plotly>=5.20", "streamlit>=1.56"]
dev = ["pyarrow>=14", "pytest>=8", "ruff>=0.6"]

[project.scripts]
factorlens = "factorlens.cli:main"

[project.urls]
Repository = "https://github.com/OussamaMesbah/FactorLens"
Issues = "https://github.com/OussamaMesbah/FactorLens/issues"

[tool.hatch.build.targets.wheel]
packages = ["factorlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
