[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fundclone"
version = "0.5.0"
description = "Clone any fund or portfolio with a handful of low-cost ETFs, out of sample"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Oussama Mesbah" }]
keywords = [
    "etf",
    "mutual-funds",
    "portfolio-replication",
    "tracking-error",
    "fama-french",
    "factor-models",
    "returns-based-style-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "yfinance>=0.2.58",
]

[project.optional-dependencies]
app = ["pdfminer.six>=20260107", "plotly>=5.20", "streamlit>=1.56"]
dev = ["pyarrow>=14", "pytest>=8", "ruff==0.16.7"]  # pinned: CI checks the formatting

[project.scripts]
fundclone = "fundclone.cli:main"

[project.urls]
Homepage = "https://fundclone.streamlit.app"
Repository = "https://github.com/OussamaMesbah/fundclone"
Issues = "https://github.com/OussamaMesbah/fundclone/issues"
Changelog = "https://github.com/OussamaMesbah/fundclone/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["fundclone"]

[tool.hatch.build.targets.sdist]
exclude = [".devcontainer/", ".github/", "data/", "docs/"]  # not needed to build or use it

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so the tests can import the benchmarks package

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
