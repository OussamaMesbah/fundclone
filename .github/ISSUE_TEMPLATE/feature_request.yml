name: Feature request
description: Suggest an improvement or a new kind of analysis
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The question you want answered or the task you want to get done.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine FundClone could do it, and what the result would look like.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
