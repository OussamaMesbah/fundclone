name: Bug report
description: Something does not work, or a number looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please report security problems privately
        instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you run or click, what did you expect, and what did you get?
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Fund, ETF or portfolio
      placeholder: "AGTHX, or VTI 60, BND 40"
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A command, a link to the web app with its settings, or a few lines of Python.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: 'The output of `fundclone --version`, or "web app".'
  - type: textarea
    id: output
    attributes:
      label: Error message or output
      render: text
