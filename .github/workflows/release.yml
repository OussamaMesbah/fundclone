name: release

# Pushing a tag such as v0.4.0 runs the tests, checks that the tag matches the package
# version, builds the package and creates the GitHub release with the CHANGELOG section as
# notes. Running the workflow by hand on a branch (gh workflow run release.yml --ref dev)
# runs the read-only jobs as a dry run: tests, build and release notes. The jobs that can
# write (the GitHub release and PyPI) run for tags only. Publishing to PyPI runs once
# trusted publishing is set up: add the pending publisher on pypi.org (workflow
# release.yml, environment pypi) and set the repository variable PUBLISH_TO_PYPI to true.
# Third-party actions are pinned to commit SHAs; Dependabot keeps them up to date.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Read the package version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $VERSION"; exit 1; }
      - run: pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $VERSION"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes.md

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        # A rerun, for example after a failed upload to PyPI, finds the release already there.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "FundClone $VERSION" --notes-file notes.md
          fi

  pypi:
    needs: [build, github-release]
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
